plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase (silent push for the assistant's queue) is optional: without
// android/firebase.local.properties the build works and the queue runs
// every 15 minutes. The values are not secret, but stay out of the repo.
def firebaseProperties = new Properties()
def firebasePropertiesFile = rootProject.file('firebase.local.properties')
if (firebasePropertiesFile.exists()) {
    firebasePropertiesFile.withInputStream { firebaseProperties.load(it) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.ma.expensy"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required for flutter_local_notifications (java.time API on API < 26)
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.ma.expensy"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [appLabel: "Nexo"]
        resValue "string", "nexo_fcm_app_id", firebaseProperties.getProperty('appId', '')
        resValue "string", "nexo_fcm_api_key", firebaseProperties.getProperty('apiKey', '')
        resValue "string", "nexo_fcm_project_id", firebaseProperties.getProperty('projectId', '')
        resValue "string", "nexo_fcm_sender_id", firebaseProperties.getProperty('senderId', '')
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        // Test builds (`flutter build apk --profile` or `--debug`) install
        // beside the daily app: another package, its own data, synthetic
        // datasets only (see DesktopProfile.initialize). Release is untouched.
        debug {
            applicationIdSuffix ".teste"
            manifestPlaceholders = [appLabel: "Nexo teste"]
        }
        profile {
            applicationIdSuffix ".teste"
            manifestPlaceholders = [appLabel: "Nexo teste"]
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Required for flutter_local_notifications on Android < API 26
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // The assistant's queue with the app closed (NexoBackground.kt).
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}

flutter {
    source = "../.."
}
